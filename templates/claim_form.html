{% extends "base.html" %}
{% block content %}
<h1>Klaim Barang</h1>
<form method="post">
  <label>Item ID * <input type="number" name="item_id" value="{{ form.get('item_id','') }}" required></label>
  <label>Nama lengkap * <input name="claimant_name" value="{{ form.get('claimant_name','') }}" required></label>
  <label>Informasi kontak * <input name="contact" value="{{ form.get('contact','') }}" required></label>
  <label>Pesan / bukti kepemilikan * <textarea name="message" rows="4" required>{{ form.get('message','') }}</textarea></label>
  <p><button type="submit">Kirim Klaim</button></p>
</form>
{% endblock %}
